# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: estimador-azure-foundry
services:
  ai-project:
    host: azure.ai.project
    # Temporal: la suscripción de Visual Studio (MVP) empieza en Free Tier, con cuota 0 para gpt-6.
    # Cuando concedan la cuota, volver a gpt-6-luna 2026-09-22 DataZoneStandard.
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 500  # 500.000 TPM. El bucle de herramientas reenvía todo el historial en cada vuelta: con 10 o 100 da 429
  estimador-azure:
    host: azure.ai.agent
    project: src/estimador-azure
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: estimador-azure
    description: Estima el coste mensual de una carga en Azure con precios oficiales y referencias de Microsoft Learn.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
      MONEDA: EUR
      # Items de la conversación anterior que se reenvían al modelo (sin esto, todos). Una estimación genera unos 30
      # y el proxy deja 8 turnos (~240): con 400 el corte no actúa en el caso normal (podría separar una llamada de su resultado).
      # En el peor caso (todos los topes de herramientas en cada turno) sí puede actuar
      DEFAULT_FETCH_HISTORY_ITEM_COUNT: "400"
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
